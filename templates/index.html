<!DOCTYPE html>
<html>
<head>
    <title>Salary Predictor App</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
    <h2>AI Salary Prediction App</h2>
    <form action="/predict" method="POST">
        <label>(Years of Experience):</label><br><br>
        <input type="text" name="experience" required><br><br>
        <button type="submit" style="padding: 10px 20px;">Predict Karein</button>
    </form>

    {% if prediction_text %}
        <h3 style="color: green; margin-top: 20px;">{{ prediction_text }}</h3>
    {% endif %}
</body>
</html>
